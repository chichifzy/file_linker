<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- 文件夹：沿用文件浏览页的 FolderIcon 造型与配色 -->
  <path d="M4 10a4 4 0 0 1 4-4h6.5l3 3H28a4 4 0 0 1 4 4v1H4z" fill="#f5b942"/>
  <rect x="3" y="12" width="30" height="19" rx="5" fill="#ffd36e"/>
  <!-- 高光，软软的 -->
  <path d="M6.6 17.2c0-1.6.7-2.7 1.9-3.4" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- 链接：两个圆角小环扣在一起 -->
  <g transform="rotate(-35 18 21.5)" fill="none" stroke-width="2.6">
    <rect x="8.6" y="18.3" width="11.6" height="6.4" rx="3.2" stroke="#fff"/>
    <rect x="15.8" y="18.3" width="11.6" height="6.4" rx="3.2" stroke="#5aa9e0"/>
    <!-- 让白环压回蓝环一段，形成"扣住"的效果 -->
    <path d="M17 18.3A3.2 3.2 0 0 1 20.01 20.41" stroke="#fff"/>
  </g>
</svg>
